server {
    listen 80;
    server_name localhost;

    # Feng Office nie ma osobnego webroot "public/" jako document root — index.php
    # w katalogu głównym jest wywoływany bezpośrednio (routing przez query string:
    # index.php?c=...&a=...), a public/ zawiera tylko statyczne assety/API/webservices.
    root /var/www/html;

    client_max_body_size 12m;

    location / {
        index index.php;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # katalogi z danymi/konfiguracją — nigdy nie serwować bezpośrednio
    location ~ ^/(config|cache|library|environment|tmp)/ {
        deny all;
    }

    # stare skrypty instalatora/upgrade'u — po zainstalowaniu blokować w produkcji
    location ~ ^/public/(install|upgrade)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    error_log /var/log/nginx/fo23_error.log;
    access_log /var/log/nginx/fo23_access.log;
}
